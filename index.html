<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== TROQUE: https://SEU-SITE.vercel.app pelo endereço real do site (em TODAS as linhas) ===== -->

    <!-- TÍTULO E DESCRIÇÃO (o que aparece no Google) -->
    <title>Luxury Nails | Manicure, Alongamento em Gel e Spa em Brasília - DF</title>
    <meta
      name="description"
      content="Salão de unhas premium em Brasília - DF. Manicure, pedicure, alongamento em gel e spa das mãos e pés, com atendimento exclusivo e hora marcada. Agende pelo WhatsApp."
    />
    <link rel="canonical" href="https://SEU-SITE.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#b4a5d3" />

    <!-- FAVICON (arquivos na pasta public/) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PRÉVIA AO COMPARTILHAR (WhatsApp, Facebook, LinkedIn, Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Luxury Nails" />
    <meta property="og:title" content="Luxury Nails | Suas unhas, ainda mais especiais" />
    <meta
      property="og:description"
      content="Manicure, alongamento em gel e spa em Brasília - DF. Agende o seu horário pelo WhatsApp."
    />
    <meta property="og:url" content="https://SEU-SITE.vercel.app/" />
    <meta property="og:image" content="https://SEU-SITE.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Luxury Nails: frasco de esmalte lavanda e mão com unhas decoradas" />

    <!-- PRÉVIA NO X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luxury Nails | Suas unhas, ainda mais especiais" />
    <meta
      name="twitter:description"
      content="Manicure, alongamento em gel e spa em Brasília - DF. Agende pelo WhatsApp."
    />
    <meta name="twitter:image" content="https://SEU-SITE.vercel.app/og-image.jpg" />

    <!-- DADOS ESTRUTURADOS: ajudam o Google a entender que é um negócio local -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NailSalon",
        "name": "Luxury Nails",
        "description": "Salão de unhas premium com atendimento exclusivo e hora marcada.",
        "url": "https://SEU-SITE.vercel.app/",
        "image": "https://SEU-SITE.vercel.app/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Brasília",
          "addressRegion": "DF",
          "addressCountry": "BR"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "09:00",
            "closes": "19:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
